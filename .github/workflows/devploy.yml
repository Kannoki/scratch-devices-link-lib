name: Deploy Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version (e.g. 2.2.1-beta.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tools:
    name: Build Tools Archive
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install 7-Zip
        run: |
          if (!(Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            winget install 7zip.7zip --accept-package-agreements --accept-source-agreements -s winget
          }

      - name: Download tools from GitHub
        shell: bash
        run: |
          cd shell/scripts
          ./download-tools.sh --platform win32 --extract-path "$HOME/tools"

      - name: Archive tools
        shell: bash
        run: |
          cd shell/scripts
          ./archive-tools.sh --overwrite

      - name: Upload tools archive
        uses: actions/upload-artifact@v4
        with:
          name: tools-archive
          path: tmp/tools-pruned-*.7z
          retention-days: 7

  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            artifact_name: FutureAcademy-arm64

          - label: macOS Intel
            os: macos-latest
            rust_target: x86_64-apple-darwin
            artifact_name: FutureAcademy-intel

          - label: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact_name: FutureAcademy-win

          - label: Windows Installer
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact_name: FutureAcademy-win-installer

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          $version = "${{ inputs.version }}"
          $content = Get-Content shell/Cargo.toml -Raw
          $content = $content -replace '(?<=^version = ")[^"]+', $version
          Set-Content -Path shell/Cargo.toml -Value $content -NoNewline
          Write-Host "Set version to $version"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/target
          key: rust-${{ matrix.rust_target }}-${{ hashFiles('shell/Cargo.lock') }}
          restore-keys: rust-${{ matrix.rust_target }}-

      - name: Build Rust tray shell
        run: cargo build --release --manifest-path shell/Cargo.toml --target ${{ matrix.rust_target }}
        env:
          OTA_MANIFEST_URL: ${{ vars.OTA_MANIFEST_URL }}

      - name: Verify Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "shell/target/${{ matrix.rust_target }}/release/FutureAcademyTray.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
          $optionalHeader = $peOffset + 24
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $optionalHeader + 68)
          if ($subsystem -ne 2) {
            throw "Expected Windows GUI subsystem (2), found $subsystem"
          }
          Write-Host "Verified Windows GUI subsystem; no console will be attached."

      - name: Package Windows portable
        if: matrix.artifact_name == 'FutureAcademy-win'
        shell: bash
        run: |
          mkdir -p dist/portable
          cp "shell/target/${{ matrix.rust_target }}/release/FutureAcademyTray.exe" dist/portable/
          grep '^version = ' shell/Cargo.toml | sed 's/.*"\([^"]*\)".*/\1/' > dist/portable/version.txt

      - name: Create portable zip
        if: matrix.artifact_name == 'FutureAcademy-win'
        shell: pwsh
        run: Compress-Archive -Path dist\portable\* -DestinationPath "dist\${{ matrix.artifact_name }}.zip"

      - name: Prepare installer payload
        if: matrix.artifact_name == 'FutureAcademy-win-installer'
        shell: bash
        run: |
          mkdir -p dist/installer-payload
          cp "shell/target/${{ matrix.rust_target }}/release/FutureAcademyTray.exe" dist/installer-payload/
          grep '^version = ' shell/Cargo.toml | sed 's/.*"\([^"]*\)".*/\1/' > dist/installer-payload/version.txt

      - name: Download tools archive
        if: matrix.artifact_name == 'FutureAcademy-win-installer'
        uses: dawidd6/action-download-artifact@v3
        with:
          name: tools-archive
          path: dist/installer-payload/
          workflow_conclusion: success

      - name: Build Inno Setup installer
        if: matrix.artifact_name == 'FutureAcademy-win-installer'
        shell: pwsh
        run: |
          $version = (Get-Content shell/Cargo.toml -Raw) -replace '.*version = "([^"]+)".*', '$1'
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="$version" /DOutputBaseFilename="FutureAcademyLink-$version-x64-setup" installer/FutureAcademyLinkWizard.iss

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.zip
            dist/*.exe
          retention-days: 7

      - name: Create zip (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp "shell/target/${{ matrix.rust_target }}/release/FutureAcademyTray" dist/
          grep '^version = ' shell/Cargo.toml | sed 's/.*"\([^"]*\)".*/\1/' > dist/version.txt
          zip -r "dist/${{ matrix.artifact_name }}.zip" dist/FutureAcademyTray dist/version.txt

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.zip
          retention-days: 7

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Read version from Cargo.toml
        id: ver
        run: |
          VERSION=$(grep '^version = ' shell/Cargo.toml | sed 's/.*"\([^"]*\)".*/\1/')
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release body
        run: |
          cat > release-body.md <<-EOF
          ## Future Academy Link v${{ steps.ver.outputs.version }} (Beta)

          > **Warning**: This is a pre-release build for testing purposes.

          ### Downloads
          | Platform | Asset |
          |----------|-------|
          | Windows (Portable) | FutureAcademy-win.zip |
          | Windows (Installer) | FutureAcademyLink-${{ steps.ver.outputs.version }}-x64-setup.exe |
          | macOS Apple Silicon | FutureAcademy-arm64.zip |
          | macOS Intel | FutureAcademy-intel.zip |

          ### Known Issues
          - Report bugs at https://github.com/${{ github.repository }}/issues
          EOF

      - name: Push tag
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.ver.outputs.tag }}
          git push origin ${{ steps.ver.outputs.tag }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }} (Beta)
          body_path: release-body.md
          files: |
            artifacts/FutureAcademy-win.zip
            artifacts/FutureAcademy-win-installer/*.exe
            artifacts/FutureAcademy-arm64.zip
            artifacts/FutureAcademy-intel.zip
          prerelease: true
