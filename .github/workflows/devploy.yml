name: Deploy Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version override (leave empty to use env.VERSION below)'
        required: false
        type: string

permissions:
  contents: write

env:
  # Change the target Beta version here (or override when triggering workflow_dispatch)
  VERSION: "2.1.22-beta.6"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            os_name: arm64
            artifact_name: FutureAcademy-arm64
            app_path: dist/Future Academy Link.app

          - label: macOS Intel
            os: macos-latest
            rust_target: x86_64-apple-darwin
            os_name: intel
            artifact_name: FutureAcademy-intel
            app_path: dist/Future Academy Link — Intel.app

          - label: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            os_name: win
            artifact_name: FutureAcademy-win

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: ver
        shell: pwsh
        run: |
          $inputVer = "${{ inputs.version }}".Trim()
          $envVer = "$env:VERSION".Trim()
          if ($inputVer) {
            $raw = $inputVer
          } elseif ($envVer) {
            $raw = $envVer
          } else {
            $raw = (Select-String -Path shell/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          }
          $version = $raw -replace '^v', ''
          $content = Get-Content shell/Cargo.toml -Raw
          $content = $content -replace '(?<=^version = ")[^"]+', $version
          Set-Content -Path shell/Cargo.toml -Value $content -NoNewline
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Set version to $version"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/target
          key: rust-${{ matrix.rust_target }}-${{ hashFiles('shell/Cargo.lock') }}
          restore-keys: rust-${{ matrix.rust_target }}-

      - name: Build Rust tray shell
        run: cargo build --release --manifest-path shell/Cargo.toml --target ${{ matrix.rust_target }}
        env:
          OTA_MANIFEST_URL: ${{ vars.OTA_MANIFEST_URL }}

      - name: Verify Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "shell/target/${{ matrix.rust_target }}/release/FutureAcademy.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
          $optionalHeader = $peOffset + 24
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $optionalHeader + 68)
          if ($subsystem -ne 2) {
            throw "Expected Windows GUI subsystem (2), found $subsystem"
          }
          Write-Host "Verified Windows GUI subsystem; no console will be attached."

      - name: Package Windows distribution
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p "dist/FutureAcademy-${VERSION}"
          cp "shell/target/${{ matrix.rust_target }}/release/FutureAcademy.exe" "dist/FutureAcademy-${VERSION}/"
          cp "shell/target/${{ matrix.rust_target }}/release/FutureAcademy.exe" "dist/FutureAcademy-${VERSION}.exe"
          echo "$VERSION" > "dist/FutureAcademy-${VERSION}/version.txt"
          if [ -d tools ]; then cp -r tools "dist/FutureAcademy-${VERSION}/"; fi

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $zipName = "FutureAcademy-${{ matrix.os_name }}-$ver.zip"
          Compress-Archive -Path "dist\FutureAcademy-$ver" -DestinationPath "dist\$zipName" -Force

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FutureAcademy-${{ matrix.os_name }}-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/FutureAcademy-${{ steps.ver.outputs.version }}
          retention-days: 7

      - name: Package macOS distribution
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p "dist/FutureAcademy-${VERSION}"
          cp "shell/target/${{ matrix.rust_target }}/release/FutureAcademy" "dist/FutureAcademy-${VERSION}/"
          echo "$VERSION" > "dist/FutureAcademy-${VERSION}/version.txt"

      - name: Create zip (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ZIP_NAME="FutureAcademy-${{ matrix.os_name }}-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/FutureAcademy-${VERSION}" "dist/${ZIP_NAME}"

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: FutureAcademy-${{ matrix.os_name }}-${{ steps.ver.outputs.version }}
          path: dist/*.zip
          retention-days: 7

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Parse version
        id: ver
        shell: bash
        run: |
          RAW="${{ inputs.version || env.VERSION }}"
          if [[ -z "${RAW// /}" ]]; then
            RAW=$(grep '^version = ' shell/Cargo.toml | head -n 1 | sed 's/.*"\([^"]*\)".*/\1/')
          fi
          VERSION=$(echo "$RAW" | tr -d '[:space:]' | sed 's/^v//')
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release body
        run: |
          cat > release-body.md <<-EOF
          ## Future Academy Link v${{ steps.ver.outputs.version }} (Beta)

          > **Warning**: This is a pre-release build for testing purposes.

          ### Downloads
          | Platform | Asset |
          |----------|-------|
          | Windows (Executable) | FutureAcademy-${{ steps.ver.outputs.version }}.exe |
          | Windows | FutureAcademy-win-${{ steps.ver.outputs.version }}.zip |
          | macOS Apple Silicon | FutureAcademy-arm64-${{ steps.ver.outputs.version }}.zip |
          | macOS Intel | FutureAcademy-intel-${{ steps.ver.outputs.version }}.zip |

          ### Known Issues
          - Report bugs at https://github.com/${{ github.repository }}/issues
          EOF

      - name: Push tag
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          remote_tag_sha=$(git ls-remote --tags origin "refs/tags/${{ steps.ver.outputs.tag }}" "refs/tags/${{ steps.ver.outputs.tag }}^{}" | awk 'END{print $1}')
          if [[ -z "$remote_tag_sha" ]]; then
            git tag ${{ steps.ver.outputs.tag }} ${{ github.sha }}
            git push origin ${{ steps.ver.outputs.tag }}
          else
            echo "Tag ${{ steps.ver.outputs.tag }} already exists remotely; skipping tag push."
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.tag }} (Beta)
          body_path: release-body.md
          files: |
            artifacts/FutureAcademy-${{ steps.ver.outputs.version }}.exe
            artifacts/FutureAcademy-win-${{ steps.ver.outputs.version }}.zip
            artifacts/FutureAcademy-arm64-${{ steps.ver.outputs.version }}.zip
            artifacts/FutureAcademy-intel-${{ steps.ver.outputs.version }}.zip
          prerelease: true
