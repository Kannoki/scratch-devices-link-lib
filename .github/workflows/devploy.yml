name: Deploy Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version (e.g. 2.2.1-beta.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tools:
    name: Download Tools
    runs-on: windows-latest
    outputs:
      tools_archive: ${{ steps.archive.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup variables
        id: vars
        run: |
          $repo = "${{ vars.WINBLOCK_TOOLS_REPO || 'winblock-tools' }}"
          $user = "${{ vars.WINBLOCK_TOOLS_USER || 'winblockcc' }}"
          echo "repo=$repo" >> $env:GITHUB_OUTPUT
          echo "user=$user" >> $env:GITHUB_OUTPUT

      - name: Get latest release info
        id: release
        shell: bash
        run: |
          USER="${{ steps.vars.outputs.user }}"
          REPO="${{ steps.vars.outputs.repo }}"
          TAG="${{ vars.WINBLOCK_TOOLS_TAG || '' }}"
          
          if [[ -n "$TAG" ]]; then
            API_URL="https://api.github.com/repos/${USER}/${REPO}/releases/tags/${TAG}"
          else
            API_URL="https://api.github.com/repos/${USER}/${REPO}/releases/latest"
          fi
          
          echo "Fetching from: $API_URL"
          ASSETS=$(curl -fsSL "$API_URL" | grep -o '"browser_download_url": "[^"]*win[^"]*"' | head -1 | sed 's/.*: "\(.*\)"/\1/')
          echo "asset_url=$ASSETS" >> $GITHUB_OUTPUT

      - name: Download tools archive
        if: steps.release.outputs.asset_url
        run: |
          curl -fsSL "${{ steps.release.outputs.asset_url }}" -o tmp/tools.7z

      - name: Install 7-Zip
        run: |
          if (!(Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            winget install 7zip.7zip --accept-package-agreements --accept-source-agreements -s winget
          }

      - name: Extract tools
        if: steps.release.outputs.asset_url
        shell: bash
        run: |
          mkdir -p tools
          cd shell/scripts
          ./extract-7z.sh ../../tmp/tools.7z ../../tools || 7z x ../../tmp/tools.7z -otools/

      - name: Archive tools
        id: archive
        shell: bash
        run: |
          cd shell/scripts
          ./archive-tools.sh --overwrite
          echo "path=tmp/tools-pruned-windows-x86_64.7z" >> $GITHUB_OUTPUT

      - name: Upload tools archive
        uses: actions/upload-artifact@v4
        with:
          name: tools-archive
          path: tmp/tools-pruned-windows-x86_64.7z
          retention-days: 7

  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            artifact_name: FutureAcademy-arm64
            app_path: dist/Future Academy Link.app

          - label: macOS Intel
            os: macos-latest
            rust_target: x86_64-apple-darwin
            artifact_name: FutureAcademy-intel
            app_path: dist/Future Academy Link — Intel.app

          - label: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact_name: FutureAcademy-win
            zip_cmd: powershell Compress-Archive -Path dist/FutureAcademy-win -DestinationPath dist/FutureAcademy-win.zip

          - label: Windows Installer
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact_name: FutureAcademy-win-installer
            build_installer: true

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          $version = "${{ inputs.version }}"
          $content = Get-Content shell/Cargo.toml -Raw
          $content = $content -replace '(?<=^version = ")[^"]+', $version
          Set-Content -Path shell/Cargo.toml -Value $content -NoNewline
          Write-Host "Set version to $version"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/target
          key: rust-${{ matrix.rust_target }}-${{ hashFiles('shell/Cargo.lock') }}
          restore-keys: rust-${{ matrix.rust_target }}-

      - name: Build Rust tray shell
        run: cargo build --release --manifest-path shell/Cargo.toml --target ${{ matrix.rust_target }}
        env:
          OTA_MANIFEST_URL: ${{ vars.OTA_MANIFEST_URL }}

      - name: Verify Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "shell/target/${{ matrix.rust_target }}/release/FutureAcademyTray.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
          $optionalHeader = $peOffset + 24
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $optionalHeader + 68)
          if ($subsystem -ne 2) {
            throw "Expected Windows GUI subsystem (2), found $subsystem"
          }
          Write-Host "Verified Windows GUI subsystem; no console will be attached."

      - name: Package Windows distribution
        if: matrix.zip_cmd
        shell: bash
        run: |
          mkdir -p dist
          # Copy executable
          cp "shell/target/${{ matrix.rust_target }}/release/FutureAcademyTray.exe" dist/
          # Create version file
          grep '^version = ' shell/Cargo.toml | sed 's/.*"\([^"]*\)".*/\1/' > dist/version.txt
          # Copy tools if exists
          if [ -d tools ]; then cp -r tools dist/; fi

      - name: Package portable
        if: matrix.artifact_name == 'FutureAcademy-win'
        shell: bash
        run: |
          mkdir -p dist/FutureAcademy-win
          cp "shell/target/${{ matrix.rust_target }}/release/FutureAcademyTray.exe" dist/FutureAcademy-win/
          grep '^version = ' shell/Cargo.toml | sed 's/.*"\([^"]*\)".*/\1/' > dist/FutureAcademy-win/version.txt

      - name: Create zip (Windows portable)
        if: matrix.artifact_name == 'FutureAcademy-win'
        shell: pwsh
        run: Compress-Archive -Path dist\FutureAcademy-win -DestinationPath dist\${{ matrix.artifact_name }}.zip

      - name: Create zip (Windows)
        if: matrix.zip_cmd
        shell: pwsh
        run: ${{ matrix.zip_cmd }}

      - name: Prepare installer payload
        if: matrix.build_installer
        shell: bash
        run: |
          mkdir -p dist/installer-payload
          cp "shell/target/${{ matrix.rust_target }}/release/FutureAcademyTray.exe" dist/installer-payload/
          grep '^version = ' shell/Cargo.toml | sed 's/.*"\([^"]*\)".*/\1/' > dist/installer-payload/version.txt

      - name: Download tools archive
        if: matrix.build_installer
        uses: dawidd6/action-download-artifact@v3
        with:
          name: tools-archive
          path: dist/installer-payload/
          workflow_conclusion: success

      - name: Build Inno Setup installer
        if: matrix.build_installer
        shell: bash
        run: |
          cd shell/scripts
          ./build-setup.sh wizard

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.zip
            dist/*.exe
          retention-days: 7

      - name: Create zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "${{ matrix.app_path }}" "dist/${{ matrix.artifact_name }}.zip"

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.zip
          retention-days: 7

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Read version from Cargo.toml
        id: ver
        run: |
          VERSION=$(grep '^version = ' shell/Cargo.toml | sed 's/.*"\([^"]*\)".*/\1/')
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release body
        run: |
          cat > release-body.md <<-EOF
          ## Future Academy Link v${{ steps.ver.outputs.version }} (Beta)

          > **Warning**: This is a pre-release build for testing purposes.

          ### Downloads
          | Platform | Asset |
          |----------|-------|
          | Windows (Portable) | FutureAcademy-win.zip |
          | Windows (Installer) | dist/FutureAcademy-*.exe |
          | macOS Apple Silicon | FutureAcademy-arm64.zip |
          | macOS Intel | FutureAcademy-intel.zip |

          ### Known Issues
          - Report bugs at https://github.com/${{ github.repository }}/issues
          EOF

      - name: Push tag
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.ver.outputs.tag }}
          git push origin ${{ steps.ver.outputs.tag }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }} (Beta)
          body_path: release-body.md
          files: |
            artifacts/FutureAcademy-win.zip
            artifacts/FutureAcademy-win-installer/dist/*.exe
            artifacts/FutureAcademy-arm64.zip
            artifacts/FutureAcademy-intel.zip
          prerelease: true
