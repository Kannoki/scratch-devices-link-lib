name: Build & Release

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            os_name: arm64
            artifact_name: FutureAcademy-arm64
            app_path: dist/Future Academy Link.app

          - label: macOS Intel
            os: macos-latest
            rust_target: x86_64-apple-darwin
            os_name: intel
            artifact_name: FutureAcademy-intel
            app_path: dist/Future Academy Link — Intel.app

          - label: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            os_name: win
            artifact_name: FutureAcademy-win

    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: ver
        shell: bash
        run: |
          VERSION=$(grep '^version = ' shell/Cargo.toml | head -n 1 | sed 's/.*"\([^"]*\)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/target
          key: rust-${{ matrix.rust_target }}-${{ hashFiles('shell/Cargo.lock') }}
          restore-keys: rust-${{ matrix.rust_target }}-

      - name: Build Rust tray shell
        run: cargo build --release --manifest-path shell/Cargo.toml --target ${{ matrix.rust_target }}
        env:
          OTA_MANIFEST_URL: ${{ vars.OTA_MANIFEST_URL }}

      - name: Verify Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "shell/target/${{ matrix.rust_target }}/release/FutureAcademy.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
          $optionalHeader = $peOffset + 24
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $optionalHeader + 68)
          if ($subsystem -ne 2) {
            throw "Expected Windows GUI subsystem (2), found $subsystem"
          }
          Write-Host "Verified Windows GUI subsystem; no console will be attached."

      - name: Package Windows distribution
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p "dist/FutureAcademy-${VERSION}"
          cp "shell/target/${{ matrix.rust_target }}/release/FutureAcademy.exe" "dist/FutureAcademy-${VERSION}/"
          echo "$VERSION" > "dist/FutureAcademy-${VERSION}/version.txt"
          if [ -d tools ]; then cp -r tools "dist/FutureAcademy-${VERSION}/"; fi

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $zipName = "FutureAcademy-${{ matrix.os_name }}-$ver.zip"
          Compress-Archive -Path "dist\FutureAcademy-$ver" -DestinationPath "dist\$zipName" -Force

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FutureAcademy-${{ matrix.os_name }}-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/FutureAcademy-${{ steps.ver.outputs.version }}
          retention-days: 7

      - name: Package macOS distribution
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p "dist/FutureAcademy-${VERSION}"
          cp "shell/target/${{ matrix.rust_target }}/release/FutureAcademy" "dist/FutureAcademy-${VERSION}/"
          echo "$VERSION" > "dist/FutureAcademy-${VERSION}/version.txt"

      - name: Create zip (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ZIP_NAME="FutureAcademy-${{ matrix.os_name }}-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/FutureAcademy-${VERSION}" "dist/${ZIP_NAME}"

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: FutureAcademy-${{ matrix.os_name }}-${{ steps.ver.outputs.version }}
          path: dist/*.zip
          retention-days: 7

  release:
    name: Release
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: ver
        run: |
          VERSION=$(grep '^version = ' shell/Cargo.toml | head -n 1 | sed 's/.*"\([^"]*\)".*/\1/')
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Validate optional R2 OTA configuration
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          OTA_MANIFEST_URL: ${{ vars.OTA_MANIFEST_URL }}
        run: |
          set -euo pipefail
          configured=0
          for value in \
            "$R2_ACCESS_KEY_ID" \
            "$R2_SECRET_ACCESS_KEY" \
            "$R2_ACCOUNT_ID" \
            "$R2_BUCKET" \
            "$R2_PUBLIC_BASE_URL" \
            "$OTA_MANIFEST_URL"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done

          if (( configured == 0 )); then
            echo "R2 OTA publishing is disabled."
          elif (( configured != 6 )); then
            echo "R2 OTA configuration is incomplete. Configure all documented secrets and variables."
            exit 1
          fi

      - name: Generate release body
        id: body
        run: |
          cat > release-body.md <<-EOF
          ## Future Academy Link v${{ steps.ver.outputs.version }}

          ### Downloads
          | Platform | Asset |
          |----------|-------|
          | Windows | FutureAcademy-win-${{ steps.ver.outputs.version }}.zip |
          | macOS Apple Silicon | FutureAcademy-arm64-${{ steps.ver.outputs.version }}.zip |
          | macOS Intel | FutureAcademy-intel-${{ steps.ver.outputs.version }}.zip |

          See [release.md](https://github.com/${{ github.repository }}/blob/main/release.md) for build instructions.
          EOF

      - name: Push tag
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          remote_tag_sha=$(git ls-remote --tags origin "refs/tags/${{ steps.ver.outputs.tag }}" "refs/tags/${{ steps.ver.outputs.tag }}^{}" | awk 'END{print $1}')
          if [[ -z "$remote_tag_sha" ]]; then
            git tag ${{ steps.ver.outputs.tag }} ${{ github.sha }}
            git push origin ${{ steps.ver.outputs.tag }}
          elif [[ "$remote_tag_sha" == "${{ github.sha }}" ]]; then
            echo "Release tag ${{ steps.ver.outputs.tag }} already points to this commit; continuing retry."
          else
            echo "Release tag ${{ steps.ver.outputs.tag }} points to another commit ($remote_tag_sha != ${{ github.sha }}). Bump shell/Cargo.toml before releasing."
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: release-body.md
          files: |
            artifacts/FutureAcademy-win-${{ steps.ver.outputs.version }}.zip
            artifacts/FutureAcademy-arm64-${{ steps.ver.outputs.version }}.zip
            artifacts/FutureAcademy-intel-${{ steps.ver.outputs.version }}.zip
          make_latest: true
