name: Release Tools

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tools release tag (e.g. tools/v2.0.0)'
        required: true
        default: 'tools/v1.0.0'
        type: string
  push:
    tags:
      - 'tools/v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Resolve release tag ─────────────────────────────────────────────────
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # ── Fetch tools for the opposite platform so pruning can run ─────────────
      # macOS: fetch Windows tools so we can prune + archive them.
      # Windows: fetch macOS tools so we can prune + archive them.
      - name: Fetch opposite-platform tools for pruning
        if: matrix.os == 'macos-latest'
        env:
          WINBLOCK_TOOLS_TAG: ${{ steps.tag.outputs.value }}
        run: node script/download-tools.js --platform win32 --extract-path tools

      - name: Fetch opposite-platform tools for pruning
        if: matrix.os == 'windows-latest'
        env:
          WINBLOCK_TOOLS_TAG: ${{ steps.tag.outputs.value }}
        shell: pwsh
        run: node script/download-tools.js --platform darwin --extract-path tools-mac

      # ── Prune + archive for current platform ───────────────────────────────
      - name: Prune tools (current platform)
        run: |
          # Clone the opposite-platform tools into the right root
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp -r tools tools-mac
            npm run tools:prune -- --apply -- --tools-root tools-mac
          else
            cp -r tools tools
            npm run tools:prune -- --apply -- --tools-root tools
          fi

      - name: Archive tools (current platform)
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            npm run tools:archive -- --overwrite -- --tools-root tools-mac
          else
            npm run tools:archive -- --overwrite -- --tools-root tools
          fi

      # ── Prune + archive for opposite platform ──────────────────────────────
      - name: Prune tools (opposite platform)
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # Already cloned above; prune the windows tools in tools/
            npm run tools:prune -- --apply -- --tools-root tools
          else
            # Already cloned above; prune the macos tools in tools-mac/
            npm run tools:prune -- --apply -- --tools-root tools-mac
          fi

      - name: Archive tools (opposite platform)
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            npm run tools:archive -- --overwrite -- --tools-root tools
          else
            npm run tools:archive -- --overwrite -- --tools-root tools-mac
          fi

      # ── Unix (macOS) ────────────────────────────────────────────────────────
      - name: Prepare artifacts (Unix)
        if: runner.os != 'Windows'
        id: meta_unix
        shell: bash
        run: |
          ARCHIVE=$(ls tmp/tools-pruned-*.7z)
          CHECKSUM="${ARCHIVE%.7z}-checksums-sha256.txt"
          shasum -a 256 "$ARCHIVE" | awk '{print $1 "  " $2}' > "$CHECKSUM"
          echo "archive=$ARCHIVE"       >> $GITHUB_OUTPUT
          echo "checksum=$CHECKSUM"     >> $GITHUB_OUTPUT
          echo "tag=${{ steps.tag.outputs.value }}" >> $GITHUB_OUTPUT

      # ── Windows ─────────────────────────────────────────────────────────────
      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        id: meta_win
        shell: pwsh
        run: |
          $name    = (Get-ChildItem tmp\tools-pruned-*.7z | Select-Object -First 1).Name
          $archive = "tmp/$name"
          $checksum = $archive -replace '\.7z$', '-checksums-sha256.txt'
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -FilePath $checksum -Encoding ascii -NoNewline
          "archive=$archive"   | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum=$checksum" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=${{ steps.tag.outputs.value }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ── Upload ──────────────────────────────────────────────────────────────
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.meta_unix.outputs.archive  || steps.meta_win.outputs.archive }}
            ${{ steps.meta_unix.outputs.checksum || steps.meta_win.outputs.checksum }}
