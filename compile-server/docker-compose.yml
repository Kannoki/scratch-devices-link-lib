version: '3.8'

services:
  compile-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: windify-compile-server
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - COMPILE_SERVER_PORT=8765
      - COMPILE_SERVER_HOST=0.0.0.0
      - MAX_CONCURRENT_JOBS=4
      - JOB_TIMEOUT_SECS=180
      - JOB_RETAIN_SECS=600
      - CORS_ORIGINS=*
    volumes:
      # Persist arduino packages & cache across container rebuilds
      - arduino-data:/root/.arduino15
      # Optional: mount extra custom libraries
      # - ./custom-libraries:/root/Arduino/libraries
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M

volumes:
  arduino-data:
